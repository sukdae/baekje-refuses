<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>백제 레퓌제 — 가상 전시 (시제품)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
  :root{
    --ink:#0b0a0d; --lacquer:#16110f; --lacquer2:#211915; --gold:#c9a24b; --gold2:#e6c98a; --paper:#efe6d2; --paper2:#b9ad96;
    --fact:#7fae86; --guess:#d7a95a; --imag:#a493cf; --hold:#c0715f;
    --serif:'Gowun Batang','Noto Serif KR','Apple SD Gothic Neo',serif;
    --sans:'Gowun Dodum','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  }
  html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font-family:var(--sans);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{display:block}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  /* 화면 가장자리를 어둡게: 등불 하나로 걷는 느낌 */
  #vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 55%,transparent 55%,rgba(5,4,6,.78) 100%);z-index:1}

  /* 위쪽 표지 */
  #mark{position:fixed;left:max(18px,env(safe-area-inset-left));top:16px;z-index:3;display:flex;align-items:baseline;gap:12px;pointer-events:none;opacity:0;transition:opacity .8s}
  #mark b{font-family:var(--serif);font-size:18px;letter-spacing:.14em;color:var(--gold)}
  #mark span{font-size:12px;letter-spacing:.08em;color:var(--paper2)}
  #helpBtn{position:fixed;right:max(16px,env(safe-area-inset-right));top:12px;z-index:3;width:34px;height:34px;border-radius:50%;border:1px solid rgba(201,162,75,.6);background:rgba(11,10,13,.6);color:var(--gold);font-family:var(--serif);font-size:16px;opacity:0;transition:opacity .8s}
  #fsBtn{position:fixed;right:calc(max(16px,env(safe-area-inset-right)) + 44px);top:12px;z-index:3;width:34px;height:34px;border-radius:50%;border:1px solid rgba(201,162,75,.6);background:rgba(11,10,13,.6);color:var(--gold);font-size:15px;line-height:1;opacity:0;transition:opacity .8s;cursor:pointer}
  body.inside #mark,body.inside #helpBtn,body.inside #fsBtn{opacity:1}
  body.nofs #fsBtn{display:none}

  /* 조작 안내: 들어가면 잠깐 보였다가 사라짐 */
  #hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:3;display:flex;gap:18px;padding:10px 18px;border-radius:999px;background:rgba(11,10,13,.72);border:1px solid rgba(201,162,75,.35);font-size:13px;color:var(--paper2);white-space:nowrap;opacity:0;transition:opacity .8s;pointer-events:none}
  #hint kbd{font-family:var(--sans);font-size:11px;color:var(--ink);background:var(--gold2);border-radius:4px;padding:1px 6px;margin-right:6px}
  #hint.on{opacity:1}

  /* 전시물 앞 안내 */
  #prompt{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:3;display:none;align-items:center;gap:10px;padding:10px 20px 10px 12px;border:1px solid var(--gold);border-radius:999px;background:rgba(11,10,13,.85);font-family:var(--serif);font-size:16px;letter-spacing:.04em;box-shadow:0 0 24px rgba(201,162,75,.18)}
  #prompt .k{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--ink);font-family:var(--sans);font-size:12px;font-weight:700}
  #prompt small{font-family:var(--sans);font-size:12px;color:var(--paper2);letter-spacing:0}

  /* 해설: 박물관 이름표처럼 오른쪽에서 나오는 카드 */
  #panel{position:fixed;z-index:10;top:0;right:0;bottom:0;width:min(440px,92vw);background:linear-gradient(180deg,rgba(22,17,15,.97),rgba(14,11,10,.97));border-left:1px solid rgba(201,162,75,.45);box-shadow:-30px 0 60px rgba(0,0,0,.55);padding:calc(28px + env(safe-area-inset-top)) max(26px,env(safe-area-inset-right)) 28px 28px;box-sizing:border-box;overflow:auto;transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);line-height:1.7;-webkit-user-select:text;user-select:text}
  #panel.open{transform:none}
  #panel .cap{font-size:12px;letter-spacing:.18em;color:var(--paper2)}
  #panel h2{font-family:var(--serif);font-weight:700;font-size:30px;letter-spacing:.06em;color:var(--gold2);margin:6px 0 4px}
  #panel .emo{font-family:var(--serif);font-size:15px;color:var(--gold);letter-spacing:.3em}
  #panel hr{border:0;height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:16px 0 8px}
  #panel .row{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid rgba(239,230,210,.07);font-size:15px}
  #panel .row:last-of-type{border-bottom:0}
  #panel .note{margin-top:16px;font-size:12px;color:var(--paper2);line-height:1.6}
  #panel .x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));width:34px;height:34px;border-radius:50%;border:1px solid rgba(201,162,75,.5);background:none;color:var(--gold);font-size:18px}
  .tag{display:inline-flex;align-items:center;justify-content:center;height:22px;font-size:11px;font-weight:700;border-radius:4px;color:#141014;letter-spacing:.02em;white-space:nowrap}
  .t-fact{background:var(--fact)}.t-guess{background:var(--guess)}.t-imag{background:var(--imag)}.t-hold{background:var(--hold)}

  /* 시작 화면 */
  #intro{position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;
    background:radial-gradient(ellipse 60% 55% at 50% 42%,rgba(201,162,75,.10),transparent 70%),radial-gradient(ellipse at 50% 120%,#1c1411,var(--ink) 60%);transition:opacity .9s}
  #intro.hide{opacity:0;pointer-events:none}
  #intro .in{max-width:620px;text-align:center}
  #intro .kicker{font-size:12px;letter-spacing:.42em;color:var(--paper2)}
  #intro h1{font-family:var(--serif);font-weight:700;font-size:clamp(40px,8vw,78px);letter-spacing:.16em;margin:.25em 0 .1em;color:var(--gold2);text-shadow:0 0 40px rgba(201,162,75,.25)}
  #intro .en{font-family:var(--serif);font-size:15px;letter-spacing:.2em;color:var(--gold)}
  #intro .rule{width:120px;height:1px;margin:26px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  #intro p{font-family:var(--serif);font-size:16px;line-height:1.9;margin:8px 0;color:var(--paper)}
  #intro p.src{font-family:var(--sans);font-size:12px;color:var(--paper2)}
  #intro .legend{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px;font-size:12px;color:var(--paper2);align-items:center}
  #intro .legend .tag{padding:0 8px}
  #start{margin-top:30px;padding:14px 34px;border-radius:999px;border:1px solid var(--gold);background:linear-gradient(180deg,rgba(201,162,75,.18),rgba(201,162,75,.04));color:var(--gold2);font-family:var(--serif);font-size:17px;letter-spacing:.14em;box-shadow:0 0 30px rgba(201,162,75,.15)}
  #start:hover{background:rgba(201,162,75,.25)}
  #start .flame{display:inline-block;width:9px;height:13px;margin-right:10px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fff3c4,#f2a43a 60%,#a5501c);box-shadow:0 0 12px #f2a43a;animation:flick 1.6s infinite;vertical-align:-1px}
  @keyframes flick{0%,100%{transform:scale(1)}45%{transform:scale(.88,1.08)}70%{transform:scale(1.06,.94)}}

  #fade{position:fixed;inset:0;z-index:11;background:var(--ink);opacity:0;pointer-events:none;transition:opacity .45s}
  #fade.on{opacity:1}
  /* 해설을 볼 때: 위아래 검은 띠, 더 짙은 가장자리, 줄마다 천천히 떠오름 */
  #bars::before,#bars::after{content:'';position:fixed;left:0;right:0;height:0;background:#000;transition:height .7s cubic-bezier(.2,.8,.2,1);z-index:2;pointer-events:none}
  #bars::before{top:0}#bars::after{bottom:0}
  body.focus #bars::before,body.focus #bars::after{height:8vh}
  #vignette{transition:opacity .8s}#vignette2{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0;transition:opacity .8s;background:radial-gradient(ellipse 55% 60% at 38% 50%,transparent 35%,rgba(0,0,0,.85) 100%)}
  body.focus #vignette2{opacity:1}
  body.focus #hint,body.focus #stick{opacity:0;pointer-events:none}
  #panel .row{opacity:0;transform:translateY(12px)}
  #panel.open .row{animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.45s + var(--i)*.22s)}
  #panel.open .cap{animation:fadein 1s both}
  #panel.open h2{animation:fadein 1.1s .1s both}
  #panel.open .emo{animation:fadein 1.2s .3s both}
  #panel.open hr{animation:grow .9s .35s both;transform-origin:left}
  @keyframes rise{to{opacity:1;transform:none}}
  @keyframes fadein{from{opacity:0;letter-spacing:.5em;filter:blur(3px)}}
  @keyframes grow{from{transform:scaleX(0)}}
  #mark #prog{color:var(--gold);letter-spacing:.06em}
  #toast{position:fixed;left:50%;top:58px;transform:translate(-50%,-8px);z-index:6;padding:10px 20px;border-radius:999px;background:rgba(11,10,13,.85);border:1px solid var(--gold);font-family:var(--serif);font-size:15px;color:var(--gold2);opacity:0;transition:opacity .6s,transform .6s;pointer-events:none;white-space:nowrap}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  /* 휴대폰 조이스틱 */
  #stick{position:fixed;left:max(24px,env(safe-area-inset-left));bottom:24px;z-index:4;width:110px;height:110px;border-radius:50%;border:1px solid rgba(201,162,75,.45);background:radial-gradient(circle,rgba(201,162,75,.08),transparent 70%);display:none}
  #knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--gold2),var(--gold));box-shadow:0 0 14px rgba(201,162,75,.5)}
  @media (pointer:coarse){body.inside #stick{display:block}}

  /* 휴대폰은 가로로 */
  #rotate{position:fixed;inset:0;z-index:20;background:var(--ink);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px;font-family:var(--serif)}
  #rotate .ph{width:46px;height:78px;border:2px solid var(--gold);border-radius:9px;animation:turn 2s ease-in-out infinite}
  @keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
  @media (pointer:coarse) and (orientation:portrait){#rotate{display:flex}}

  /* 가로 휴대폰처럼 화면 높이가 낮을 때 */
  @media (max-height:500px){
    #intro h1{font-size:40px;margin:.1em 0 0}#intro .rule{margin:12px auto}
    #intro p{font-size:13px;line-height:1.6;margin:4px 0}#intro .legend{margin-top:8px}
    #start{margin-top:12px;padding:10px 26px;font-size:15px}
    #mark{top:10px}#mark b{font-size:15px}
    #hint{bottom:14px;font-size:11px;gap:12px;padding:7px 14px}
    #prompt{bottom:22px;font-size:14px}
    #stick{width:96px;height:96px;bottom:14px}
    #knob{left:28px;top:28px}
    #panel{width:min(400px,62vw);padding-top:18px}
    #panel h2{font-size:24px}#panel .row{font-size:13.5px;padding:7px 0}
  }
</style>
</head>
<body>
<div id="vignette"></div>
<div id="mark"><b>백제 레퓌제</b><span id="markSub">코스 1 · 백제문화관</span><span id="prog"></span></div>
<div id="bars"></div><div id="vignette2"></div><div id="toast"></div>
<button id="helpBtn" aria-label="조작 안내">?</button>
<button id="fsBtn" aria-label="전체화면" title="전체화면 (F)">⛶</button>
<div id="hint"></div>
<div id="prompt"></div>
<aside id="panel" aria-live="polite"></aside>
<div id="stick"><div id="knob"></div></div>
<div id="fade"></div>
<div id="rotate"><div class="ph"></div><div>화면을 가로로 돌려 주세요</div><div style="font-size:13px;opacity:.6;font-family:var(--sans)">이 전시는 가로 화면에 맞춰져 있습니다</div></div>

<div id="intro"><div class="in">
  <div class="kicker">가상 전시 · 시제품</div>
  <h1>백제 레퓌제</h1>
  <div class="en">낙선전 · Salon des Refusés</div>
  <div class="rule"></div>
  <p>1863년 파리, 공식 살롱에서 떨어진 작품들이 따로 전시되었습니다. 그것이 낙선전입니다.</p>
  <p class="src">(이 문장의 세부는 출처 미확인 — 미술사 자료로 대조 예정)</p>
  <p>백제의 찬란함은 많이 주목받았지만, 그 속의 처절한 사투는 잘 보이지 않았습니다.<br>이 전시는 등불 하나를 들고 그쪽을 걷습니다.</p>
  <div class="legend">설명은 <span class="tag t-fact">사실</span><span class="tag t-guess">추정</span><span class="tag t-imag">상상</span><span class="tag t-hold">확인 중</span> 으로 나누어 적습니다</div>
  <button id="start"><span class="flame"></span>등불 들고 들어가기</button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
// ---------- 전시 내용 ----------
const ITEMS = [
  { id:'jeongeup', name:'정읍사', sub:'그리움 · 코스 1 백제문화관', pos:[-7,0,-6],
    rows:[
      ['fact','행상 나간 남편이 밤길에 해를 입을까 걱정하며 달에게 비는 아내의 노래로 전한다.'],
      ['fact','가사는 『악학궤범』 권5에 실려 전하고, 『고려사』 악지의 삼국속악 조에도 기록이 있다. (한국민족문화대백과사전 「정읍사」)'],
      ['guess','백제 때부터 구전된 노래로 알려져 있지만, 통일신라 경덕왕 이후나 고려 시대 옛 백제 땅의 민요로 보는 견해도 있다.'],
      ['hold','그래서 이 노래를 "백제가 전한 기억"으로 단정하지 않는다.'],
      ['imag','기다리는 사람은 끝내 이름을 남기지 못했다.']
    ]},
  { id:'sataek', name:'사택지적비', sub:'허무 · 코스 1 백제문화관', pos:[0,0,-8],
    rows:[
      ['fact','사택지적이라는 귀족이 늙어 가는 것을 탄식하고 절을 세운 일을 새긴 비. 비문은 한국사DB 금석문에서 확인할 수 있다.'],
      ['guess','연대는 비문의 갑인년을 654년(의자왕 14년)으로 보는 것이 일반적이다. (원문 대조 확인 중)'],
      ['hold','발견 경위와 보관 경로는 확인 중.'],
      ['imag','한 치 앞을 모르는 사람이 돌에 시간을 새기려 했다.']
    ]},
  { id:'incense', name:'금동대향로', sub:'애도 · 코스 1 백제문화관', pos:[7,0,-6],
    rows:[
      ['fact','1993년 12월 12일, 부여 능산리 고분군과 나성 터 사이의 백제 유적 발굴 현장에서 여러 유물과 함께 나왔다. 1996년 국보로 지정되었다. (한국민족문화대백과사전 「백제금동대향로」)'],
      ['fact','같은 절터에서 나온 사리감에는 창왕(위덕왕) 13년(567)에 공주가 사리를 공양했다는 글이 있다. (같은 사전 「부여 능산리 사지 석조 사리감」)'],
      ['guess','그래서 이 절은 성왕의 명복을 빌려고 세운 것으로 해석된다. (같은 사전)'],
      ['hold','향로 자체를 위덕왕이 성왕 추모를 위해 만들었다는 것, 멸망 때 급히 묻었다는 것은 확인 중.'],
      ['hold','누가, 왜 숨겼는지는 알려져 있지 않다.'],
      ['imag','이름 모를 누군가가 이것을 흙 속에 맡겼다고 상상해 본다.']
    ]},
  { id:'gate', name:'코스 2 — 백제역사관', sub:'준비 중', pos:[-10.7,0,5], rotY:Math.PI/2,
    rows:[
      ['hold','쓰러지고 일어서다: 한성의 끝부터 부흥운동까지. 사료 확인이 끝나는 대로 열립니다.'],
      ['fact','계획된 장면: 개로왕과 문주왕 · 무령왕과 성왕의 중흥 · 성왕 전사 · 위덕왕 · 계백과 황산벌 · 멸망 · 부흥운동'],
      ['imag','마지막에는 관람객에게 질문을 남깁니다.']
    ]}
];
// 배치와 감정 단어(기획서 '감정과 유물의 대응' 초안)
const META={
  jeongeup:{pos:[-6.5,0,-4.6],emo:'그리움',course:'코스 1 · 백제문화관'},
  sataek:{pos:[0,0,-6.6],emo:'허무',course:'코스 1 · 백제문화관'},
  incense:{pos:[6.5,0,-4.6],emo:'애도',course:'코스 1 · 백제문화관'},
  gate:{pos:[-10.75,0,4.5],rotY:Math.PI/2,emo:'들어가기',course:'코스 2'}
};
ITEMS.forEach(it=>Object.assign(it,META[it.id]||{}));
const TAGNAME={fact:'사실',guess:'추정',imag:'상상',hold:'확인 중'};

// ---------- 기본 장면 ----------
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x07060a);
scene.fog=new THREE.FogExp2(0x07060a,.03);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,120);
function fitCamera(){camera.aspect=innerWidth/innerHeight;camera.fov=camera.aspect<1?74:58;camera.updateProjectionMatrix();}
fitCamera();
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.45;
document.body.appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0x4a4466,0x1a120e,1.0);scene.add(hemi);
const ROOM={x:11,zmin:-11,zmax:11,h:6.2};

// ---------- 캔버스로 만든 무늬 ----------
const REDRAW=[];
function tex(w,h,draw,rep,font){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);
  if(font)REDRAW.push(()=>{const x=c.getContext('2d');x.clearRect(0,0,w,h);draw(x,w,h);t.needsUpdate=true;});if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}t.anisotropy=4;return t;}
function lotus(x,cx,cy,r,col){x.save();x.translate(cx,cy);x.strokeStyle=col;x.lineWidth=1.4;
  for(let i=0;i<8;i++){x.rotate(Math.PI/4);x.beginPath();x.moveTo(0,r*.18);x.quadraticCurveTo(r*.28,r*.55,0,r);x.quadraticCurveTo(-r*.28,r*.55,0,r*.18);x.stroke();}
  x.beginPath();x.arc(0,0,r*.16,0,Math.PI*2);x.stroke();x.restore();}

  for(let k=0;k<2600;k++){x.fillStyle=`rgba(255,240,220,${Math.random()*.035})`;x.fillRect(Math.random()*w,Math.random()*h,1.5,1.5);}

// ---------- 코스 2 회랑 공간 (딥시크 deepseek-flash가 작성, 2026-11-23. Claude가 검토·수정: 벽등 위치) ----------
function buildCourse2(ctx) {
  var THREE = ctx.THREE, scene = ctx.scene, acts = ctx.acts;
  var N = acts.length;
  var OX = -40, W = 7, H = 5.6, ZS = 5;
  var ZE = -2 - (N - 1) * 6 - 9;
  var colliders = [];
  var stations = [];
  var dustGeo, dustPos, dustVel;

  function cloneTex(t, rx, ry) {
    var c = t.clone();
    c.needsUpdate = true;
    c.wrapS = c.wrapT = THREE.RepeatWrapping;
    c.repeat.set(rx, ry);
    return c;
  }

  // Floor
  var floorLen = ZS - ZE;
  var floorMat = new THREE.MeshStandardMaterial({
    map: cloneTex(ctx.floorTex, W / 2, floorLen / 2),
    roughness: 0.85
  });
  var floor = new THREE.Mesh(new THREE.PlaneGeometry(W, floorLen), floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(OX, 0, (ZS + ZE) / 2);
  floor.receiveShadow = true;
  scene.add(floor);

  // Walls
  var wallMatL = new THREE.MeshStandardMaterial({
    map: cloneTex(ctx.wallTex, floorLen / 3, H / 3), roughness: 0.95
  });
  var wallMatR = new THREE.MeshStandardMaterial({
    map: cloneTex(ctx.wallTex, floorLen / 3, H / 3), roughness: 0.95
  });
  var wallMatE = new THREE.MeshStandardMaterial({
    map: cloneTex(ctx.wallTex, W / 3, H / 3), roughness: 0.95
  });

  var leftWall = new THREE.Mesh(new THREE.PlaneGeometry(floorLen, H), wallMatL);
  leftWall.rotation.y = Math.PI / 2;
  leftWall.position.set(OX - W / 2, H / 2, (ZS + ZE) / 2);
  scene.add(leftWall);

  var rightWall = new THREE.Mesh(new THREE.PlaneGeometry(floorLen, H), wallMatR);
  rightWall.rotation.y = -Math.PI / 2;
  rightWall.position.set(OX + W / 2, H / 2, (ZS + ZE) / 2);
  scene.add(rightWall);

  var endWallE = new THREE.Mesh(new THREE.PlaneGeometry(W, H), wallMatE);
  endWallE.rotation.y = Math.PI;
  endWallE.position.set(OX, H / 2, ZS);
  scene.add(endWallE);

  var endWallF = new THREE.Mesh(new THREE.PlaneGeometry(W, H), wallMatE);
  endWallF.position.set(OX, H / 2, ZE);
  scene.add(endWallF);

  // Baseboards
  var baseMat = new THREE.MeshStandardMaterial({ color: 0x2a1f19, roughness: 0.9 });
  var bbGeo = new THREE.BoxGeometry(0.08, 0.28, floorLen);
  var bbL = new THREE.Mesh(bbGeo, baseMat);
  bbL.position.set(OX - W / 2 + 0.04, 0.14, (ZS + ZE) / 2);
  scene.add(bbL);
  var bbR = new THREE.Mesh(bbGeo, baseMat);
  bbR.position.set(OX + W / 2 - 0.04, 0.14, (ZS + ZE) / 2);
  scene.add(bbR);

  // Pillars
  var baseGeo = new THREE.CylinderGeometry(0.42, 0.5, 0.3, 12);
  var baseMatP = new THREE.MeshStandardMaterial({ color: 0x6d675e, roughness: 0.9 });
  var shaftGeo = new THREE.CylinderGeometry(0.26, 0.3, H - 0.3, 12);
  var pillarZs = [];
  for (var i = 0; i < N - 1; i++) {
    var pz = -5 - i * 6;
    pillarZs.push(pz);
    for (var s = -1; s <= 1; s += 2) {
      var px = OX + s * 3.15;
      var base = new THREE.Mesh(baseGeo, baseMatP);
      base.position.set(px, 0.15, pz);
      base.castShadow = true;
      scene.add(base);
      var shaft = new THREE.Mesh(shaftGeo, ctx.mats.pillarMat);
      shaft.position.set(px, 0.3 + (H - 0.3) / 2, pz);
      shaft.castShadow = true;
      scene.add(shaft);
      colliders.push([px, pz, 0.55]);
    }
  }

  // Ceiling beams
  var beamGeo = new THREE.BoxGeometry(W, 0.3, 0.36);
  for (var bz = ZS - 2; bz > ZE; bz -= 4) {
    var beam = new THREE.Mesh(beamGeo, ctx.mats.beamMat);
    beam.position.set(OX, H - 0.15, bz);
    scene.add(beam);
  }

  // Stations
  var boardGeo = new THREE.BoxGeometry(2.4, 2.8, 0.14);
  var plinthGeo = new THREE.BoxGeometry(1.1, 0.5, 0.6);
  var goldStripGeo = new THREE.BoxGeometry(1.1, 0.06, 0.6);
  var goldStripMat = new THREE.MeshStandardMaterial({ color: 0xc9a24b, roughness: 0.4, metalness: 0.6 });

  for (var i = 0; i < N; i++) {
    var act = acts[i];
    var sz = -2 - i * 6;
    var left = (i % 2 === 0);
    var wallX = left ? OX - W / 2 : OX + W / 2;
    var dir = left ? 1 : -1;
    var boardX = wallX + dir * 0.12;
    var rotY = left ? Math.PI / 2 : -Math.PI / 2;

    var board = new THREE.Mesh(boardGeo, ctx.mats.plinthDark);
    board.position.set(boardX, 1.9, sz);
    board.rotation.y = rotY;
    scene.add(board);

    var edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(boardGeo),
      new THREE.LineBasicMaterial({ color: 0xc9a24b, transparent: true, opacity: 0.6 })
    );
    edges.position.copy(board.position);
    edges.rotation.y = rotY;
    scene.add(edges);

    var t1 = ctx.textPlane([(i + 1) + '막', act.title], { w: 2.2, h: 1.1, size: 96 });
    t1.position.set(boardX + dir * 0.09, 2.7, sz);
    t1.rotation.y = rotY;
    scene.add(t1);

    var t2 = ctx.textPlane([act.years], { w: 1.6, h: 0.5, size: 80, color: '#c9a24b' });
    t2.position.set(boardX + dir * 0.09, 1.9, sz);
    t2.rotation.y = rotY;
    scene.add(t2);

    var plinth = new THREE.Mesh(plinthGeo, ctx.mats.plinthDark);
    plinth.position.set(boardX + dir * 0.35, 0.25, sz);
    plinth.rotation.y = rotY;
    scene.add(plinth);

    var strip = new THREE.Mesh(goldStripGeo, goldStripMat);
    strip.position.set(boardX + dir * 0.35, 0.52, sz);
    strip.rotation.y = rotY;
    scene.add(strip);

    var spot = new THREE.SpotLight(0xffe0b0, 2.0, 9, 0.5, 0.6, 1.4);
    spot.position.set(boardX + dir * 1.6, H - 0.2, sz);
    spot.target.position.set(boardX, 1.9, sz);
    scene.add(spot);
    scene.add(spot.target);

    var standX = boardX + dir * 1.9;
    stations.push({ index: i, x: standX, z: sz, board: board });
    colliders.push([boardX + dir * 0.7, sz, 0.75]);
  }

  // Wall lamps (Claude 수정: 원래 x=±3.1이라 기둥(±3.15, 반지름 .3) 안에 묻혔음 → 기둥 안쪽 면 앞으로)
  var lampGeo = new THREE.BoxGeometry(0.14, 0.22, 0.14);
  var lampMat = new THREE.MeshStandardMaterial({
    color: 0xff9d3a, emissive: 0xff9d3a, emissiveIntensity: 1.2
  });
  var pointCount = 0;
  for (var i = 0; i < pillarZs.length; i++) {
    var pz = pillarZs[i];
    for (var s = -1; s <= 1; s += 2) {
      var lx = OX + s * (3.15 - 0.38);
      var lamp = new THREE.Mesh(lampGeo, lampMat);
      lamp.position.set(lx, 3, pz);
      scene.add(lamp);
      var gl = ctx.glow(ctx.GLOW_WARM, 1.4, 0.8);
      gl.position.set(lx, 3, pz);
      scene.add(gl);
      if (i % 2 === 0 && pointCount < 6) {
        var pl = new THREE.PointLight(0xff9f50, 0.9, 8, 2);
        pl.position.set(lx, 3, pz);
        scene.add(pl);
        pointCount++;
      }
    }
  }

  // Entrance end
  var frameGeo = new THREE.BoxGeometry(0.32, 3.8, 0.32);
  var fL = new THREE.Mesh(frameGeo, ctx.mats.pillarMat);
  fL.position.set(OX - 1.7, 1.9, ZS - 0.16);
  scene.add(fL);
  var fR = new THREE.Mesh(frameGeo, ctx.mats.pillarMat);
  fR.position.set(OX + 1.7, 1.9, ZS - 0.16);
  scene.add(fR);
  var lintel = new THREE.Mesh(new THREE.BoxGeometry(4, 0.36, 0.44), ctx.mats.beamMat);
  lintel.position.set(OX, 3.95, ZS - 0.16);
  scene.add(lintel);
  var doorPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(3.2, 3.6),
    new THREE.MeshBasicMaterial({ color: 0x020205 })
  );
  doorPlane.rotation.y = Math.PI;
  doorPlane.position.set(OX, 1.9, ZS - 0.05);
  scene.add(doorPlane);
  var backText = ctx.textPlane(['코스 1로 돌아가기'], { w: 2.6, h: 0.6, size: 80 });
  backText.rotation.y = Math.PI;
  backText.position.set(OX, 4.5, ZS - 0.2);
  scene.add(backText);
  var backGate = { x: OX, z: ZS - 1.0 };

  // Final end
  var endText = ctx.textPlane(['기억을 건네받은 당신은', '무엇을 하겠습니까?'], { w: 5.6, h: 1.8, size: 92, even: true });
  endText.position.set(OX, 3, ZE + 0.1);
  scene.add(endText);
  var endGlow = ctx.glow(ctx.GLOW_WARM, 3, 0.35);
  endGlow.position.set(OX, 3, ZE + 0.2);
  scene.add(endGlow);
  var endSpot = new THREE.SpotLight(0xffd9a0, 1.6, 12, 0.6, 0.7);
  endSpot.position.set(OX, H, ZE + 4);
  endSpot.target.position.set(OX, 3, ZE);
  scene.add(endSpot);
  scene.add(endSpot.target);
  var endPoint = { x: OX, z: ZE + 2.5 };

  // Dust
  var dustCount = 200;
  dustPos = new Float32Array(dustCount * 3);
  dustVel = new Float32Array(dustCount);
  for (var i = 0; i < dustCount; i++) {
    dustPos[i * 3] = OX - W / 2 + Math.random() * W;
    dustPos[i * 3 + 1] = Math.random() * H;
    dustPos[i * 3 + 2] = ZE + Math.random() * (ZS - ZE);
    dustVel[i] = 0.05 + Math.random() * 0.12;
  }
  dustGeo = new THREE.BufferGeometry();
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
  var dustMat = new THREE.PointsMaterial({
    color: 0xffe2b0, size: 0.035, transparent: true, opacity: 0.5,
    depthWrite: false, blending: THREE.AdditiveBlending
  });
  var dust = new THREE.Points(dustGeo, dustMat);
  scene.add(dust);

  return {
    bounds: { xmin: OX - W / 2 + 0.7, xmax: OX + W / 2 - 0.7, zmin: ZE + 0.7, zmax: ZS - 0.7 },
    entry: { x: OX, z: ZS - 2.2, yaw: 0 },
    colliders: colliders,
    stations: stations,
    backGate: backGate,
    endPoint: endPoint,
    endText: endText, endGlow: endGlow, // Claude 추가: 마지막 물음 잠금용
    update: function (t, dt) {
      var pos = dustGeo.attributes.position.array;
      for (var i = 0; i < dustCount; i++) {
        pos[i * 3 + 1] += dustVel[i] * dt;
        pos[i * 3] += Math.sin(t * 0.5 + i) * 0.002;
        if (pos[i * 3 + 1] > H) {
          pos[i * 3 + 1] = 0;
          pos[i * 3] = OX - W / 2 + Math.random() * W;
          pos[i * 3 + 2] = ZE + Math.random() * (ZS - ZE);
        }
      }
      dustGeo.attributes.position.needsUpdate = true;
    }
  };
}

  .concat([{id:'back',name:'코스 1로 돌아가기',emo:'',course:'',pos:[C2.backGate.x,0,C2.backGate.z+.3],go:'hall',r:1.3},

    else{const g=ITEMS.find(i=>i.id==='gate');player.position.set(g.pos[0]+2.4,0,g.pos[2]);yaw=-Math.PI/2;document.getElementById('markSub').textContent='코스 1 · 백제문화관';}
    player.rotation.y=yaw+Math.PI;pitch=.36;
    camera.position.set(player.position.x+Math.sin(yaw)*Math.cos(pitch)*dist,1.35+Math.sin(pitch)*dist,player.position.z+Math.cos(yaw)*Math.cos(pitch)*dist);
    setTimeout(()=>f.classList.remove('on'),120);},450);
}

// 향로 연기
const smokeTex=glowTex('rgba(230,225,215,.55)','rgba(200,195,190,.12)');const SMOKE=[];
{const inc=ITEMS.find(i=>i.id==='incense');for(let i=0;i<14;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:smokeTex,transparent:true,depthWrite:false,opacity:0}));s.userData.t=Math.random();inc.group.add(s);SMOKE.push(s);}}

// 떠다니는 먼지
const DUST_N=380,dustGeo=new THREE.BufferGeometry(),dp=new Float32Array(DUST_N*3);
for(let i=0;i<DUST_N;i++){dp[i*3]=(Math.random()-.5)*20;dp[i*3+1]=Math.random()*5.6;dp[i*3+2]=(Math.random()-.5)*20;}
dustGeo.setAttribute('position',new THREE.BufferAttribute(dp,3));
const dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0xffe2b0,size:.035,transparent:true,opacity:.55,depthWrite:false,blending:THREE.AdditiveBlending}));scene.add(dust);

// ---------- 관람객(등불을 든 사람) ----------
const player=new THREE.Group();
const robe=new THREE.Mesh(new THREE.CylinderGeometry(.2,.42,1.25,16),new THREE.MeshStandardMaterial({color:0x2e2a33,roughness:.9}));robe.position.y=.63;robe.castShadow=true;
const collar=new THREE.Mesh(new THREE.TorusGeometry(.17,.035,8,18),new THREE.MeshStandardMaterial({color:0xc9a24b,metalness:.6,roughness:.4}));collar.rotation.x=Math.PI/2;collar.position.y=1.24;
const head=new THREE.Mesh(new THREE.SphereGeometry(.17,18,14),new THREE.MeshStandardMaterial({color:0xd9c2a2,roughness:.8}));head.position.y=1.42;head.castShadow=true;
const hat=new THREE.Mesh(new THREE.CylinderGeometry(.1,.13,.16,14),new THREE.MeshStandardMaterial({color:0x14110f,roughness:.6}));hat.position.y=1.6;
const arm=new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,.7,6),new THREE.MeshStandardMaterial({color:0x3a2a1c}));arm.position.set(.28,1.05,.22);arm.rotation.x=-1.0;
const lanternBox=new THREE.Mesh(new THREE.CylinderGeometry(.07,.08,.17,8),new THREE.MeshStandardMaterial({color:0xffc27a,emissive:0xff9d3a,emissiveIntensity:1.8}));lanternBox.position.set(.28,.78,.5);
const lanternGlow=glow(GLOW_WARM,1.1,.9);lanternGlow.position.copy(lanternBox.position);
const lanternLight=new THREE.PointLight(0xffa955,1.5,7.5,2);lanternLight.position.set(.28,.95,.5);
player.add(robe,collar,head,hat,arm,lanternBox,lanternGlow,lanternLight);
player.position.set(0,0,7.5);scene.add(player);
// 주인공: 영남대 마스코트 푸르마(학교 사용 허락 확인, 2026-11-23)가 푸른 백제 관복을 입은 모습. models/purma.glb (블렌더로 직접 제작)
// 팔·다리·날개가 따로 움직이도록 나뉘어 있다. 불러오지 못하면 위의 간이 인물을 그대로 쓴다.
const PU={};let walkAmt=0,movingNow=false;
if(THREE.GLTFLoader)new THREE.GLTFLoader().load('models/purma.glb',gl=>{
  gl.scene.traverse(m=>{if(m.isMesh)m.castShadow=true;});
  ['Body','Robe','ArmR','ArmL','LegR','LegL','WingR','WingL'].forEach(k=>{PU[k]=gl.scene.getObjectByName('Purma_'+k);});
  [robe,collar,head,hat,arm].forEach(m=>m.visible=false);
  // 새 모형(2026-11-24)은 등불을 직접 들고 있다: 코드 등불은 숨기고 빛만 모형 등불 자리로 옮긴다.
  const PL=gl.scene.getObjectByName('Purma_Lantern');
  if(PL){lanternBox.visible=false;gl.scene.updateMatrixWorld(true);const lp=new THREE.Vector3();PL.getWorldPosition(lp);lanternGlow.position.copy(lp);lanternLight.position.copy(lp);}
  else{lanternBox.position.set(.31,.55,.36);lanternGlow.position.copy(lanternBox.position);lanternLight.position.set(.31,.62,.36);}
  PU.root=gl.scene;player.add(gl.scene);
},undefined,e=>console.warn('푸르마 모형을 불러오지 못해 간이 인물을 씁니다',e));

// ---------- 입력 ----------
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE'||e.code==='Enter')interact();if(e.code==='Escape')closePanel();});
addEventListener('keyup',e=>keys[e.code]=false);
let yaw=0,pitch=.36,dist=6.4,joy={x:0,y:0},joyId=null,target=null,drag=null,movedOnce=false;
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),ground=new THREE.Plane(new THREE.Vector3(0,1,0),0),hit=new THREE.Vector3();
const inside=()=>document.body.classList.contains('inside');
renderer.domElement.addEventListener('pointerdown',e=>{if(open||!inside())return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY};});
addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;yaw-=(e.clientX-drag.x)*.006;pitch=Math.max(.06,Math.min(1.05,pitch+(e.clientY-drag.y)*.005));drag.x=e.clientX;drag.y=e.clientY;});
addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.id)return;
  if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6){ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);if(ray.ray.intersectPlane(ground,hit))target=hit.clone();}
  drag=null;});
addEventListener('wheel',e=>{dist=Math.max(3,Math.min(9,dist+e.deltaY*.005));});
const stick=document.getElementById('stick'),knob=document.getElementById('knob');
function centerKnob(){knob.style.left='';knob.style.top='';}
stick.addEventListener('pointerdown',e=>{joyId=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e);});
stick.addEventListener('pointermove',e=>{if(e.pointerId===joyId)moveStick(e);});
stick.addEventListener('pointerup',e=>{joyId=null;joy={x:0,y:0};centerKnob();});
function moveStick(e){const r=stick.getBoundingClientRect(),h=r.width/2,k=knob.offsetWidth/2,reach=h-k;let dx=(e.clientX-r.left-h)/reach,dy=(e.clientY-r.top-h)/reach;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;}joy={x:dx,y:dy};knob.style.left=(h-k+dx*reach)+'px';knob.style.top=(h-k+dy*reach)+'px';}

// ---------- 안내와 해설 ----------
const promptEl=document.getElementById('prompt'),panel=document.getElementById('panel'),hintEl=document.getElementById('hint');
const coarse=matchMedia('(pointer:coarse)').matches;
hintEl.innerHTML=coarse?'<span>조이스틱 · 바닥 누르기로 이동</span><span>끌어서 둘러보기</span><span>전시물 앞에서 안내 누르기</span>'
  :'<span><kbd>W A S D</kbd>이동</span><span><kbd>바닥 클릭</kbd>그곳으로</span><span><kbd>끌기</kbd>둘러보기</span><span><kbd>E</kbd>해설</span>';
let hintTimer=null;function showHint(ms){hintEl.classList.add('on');clearTimeout(hintTimer);hintTimer=setTimeout(()=>hintEl.classList.remove('on'),ms||6000);}
document.getElementById('helpBtn').onclick=()=>showHint(5000);
let near=null,open=false;
promptEl.addEventListener('click',interact);
function interact(){if(open){closePanel();return;}if(!near)return;if(near.go){goArea(near.go);return;}open=true;focusIt=near;document.body.classList.add('focus');const ROWS=near.id==='end'&&!unlocked()?lockedRows():near.rows;markViewed(near);
  panel.innerHTML=`<button class="x" aria-label="닫기">×</button><div class="cap">${near.course}</div><h2>${near.name}</h2><div class="emo">${near.emo}</div><hr>`+
    ROWS.map((r,i)=>`<div class="row" style="--i:${i}"><span class="tag t-${r[0]}">${TAGNAME[r[0]]}</span><span>${r[1]}</span></div>`).join('')+
    `<div class="note">사실·추정·상상·확인 중을 나누어 적었습니다. 출처를 확인하지 못한 것은 '확인 중'으로 둡니다.</div>`;
  panel.classList.add('open');panel.querySelector('.x').onclick=closePanel;promptEl.style.display='none';}
function closePanel(){open=false;panel.classList.remove('open');document.body.classList.remove('focus');if(focusIt)setTimeout(()=>{if(!open)focusIt=null;},700);}
document.getElementById('start').onclick=()=>{
  document.getElementById('intro').classList.add('hide');document.body.classList.add('inside');setTimeout(()=>showHint(7000),700);
  goFull(); // 들어가는 순간 자동 전체화면(브라우저가 클릭 없이는 허용하지 않음)
};
// ---------- 전체화면 ----------
function isFull(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function goFull(){const el=document.documentElement,fs=el.requestFullscreen||el.webkitRequestFullscreen;
  if(!fs||isFull())return;
  Promise.resolve(fs.call(el)).then(()=>{if(coarse&&screen.orientation&&screen.orientation.lock)return screen.orientation.lock('landscape');}).catch(()=>{});}
function exitFull(){const ex=document.exitFullscreen||document.webkitExitFullscreen;if(ex&&isFull())Promise.resolve(ex.call(document)).catch(()=>{});}
function toggleFull(){isFull()?exitFull():goFull();}
// 아이폰 사파리처럼 전체화면을 지원하지 않으면 버튼을 숨김(화면은 이미 창 전체를 씀)
if(!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen))document.body.classList.add('nofs');
document.getElementById('fsBtn').onclick=e=>{e.stopPropagation();toggleFull();};
addEventListener('keydown',e=>{if(e.code==='KeyF'&&!e.repeat&&document.body.classList.contains('inside')&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))toggleFull();});
function syncFs(){document.getElementById('fsBtn').textContent=isFull()?'⤢':'⛶';document.getElementById('fsBtn').setAttribute('aria-label',isFull()?'전체화면 끄기':'전체화면');}
addEventListener('fullscreenchange',syncFs);addEventListener('webkitfullscreenchange',syncFs);

// ---------- 루프 ----------
const clock=new THREE.Clock();
const COLLIDERS=()=>area==='hall'?COLS.concat(ITEMS.filter(i=>i.id!=='gate').map(i=>[i.pos[0],i.pos[2],1.35])):C2.colliders;
function loop(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  movingNow=false;
  if(!open&&inside()){
    let mx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x;
    let mz=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+joy.y;
    let l=Math.hypot(mx,mz);const sp=3.6,s=Math.sin(yaw),c=Math.cos(yaw);let vx=0,vz=0;
    if(l>.05){target=null;if(l>1){mx/=l;mz/=l;}vx=(mx*c+mz*s)*sp*dt;vz=(-mx*s+mz*c)*sp*dt;}
    else if(target){const dx=target.x-player.position.x,dz=target.z-player.position.z,d=Math.hypot(dx,dz);if(d<.15)target=null;else{const st=Math.min(d,sp*dt);vx=dx/d*st;vz=dz/d*st;}}
    if(vx||vz){
      let nx=player.position.x+vx,nz=player.position.z+vz;
      const B=bounds();nx=Math.max(B.xmin,Math.min(B.xmax,nx));nz=Math.max(B.zmin,Math.min(B.zmax,nz));
      COLLIDERS().forEach(([cx,cz,r])=>{const dx=nx-cx,dz=nz-cz,d=Math.hypot(dx,dz);if(d<r&&d>0){nx=cx+dx/d*r;nz=cz+dz/d*r;}});
      player.position.x=nx;player.position.z=nz;
      const want=Math.atan2(vx,vz);let diff=want-player.rotation.y;diff=Math.atan2(Math.sin(diff),Math.cos(diff));player.rotation.y+=diff*Math.min(1,dt*10);
      robe.position.y=.63+Math.abs(Math.sin(t*9))*.025;movingNow=true;
      if(!movedOnce){movedOnce=true;setTimeout(()=>hintEl.classList.remove('on'),2500);}
    }
  }
  // 푸르마 걷기: 다리·팔 흔들기, 날개 파닥임, 몸 들썩임
  walkAmt+=((movingNow?1:0)-walkAmt)*Math.min(1,dt*8);
  if(PU.root&&PU.LegR){const w=Math.sin(t*9)*walkAmt;
    PU.LegR.rotation.x=w*.6;PU.LegL.rotation.x=-w*.6;PU.ArmL.rotation.x=-w*.5;
    const f=Math.sin(t*(3+walkAmt*7))*(.12+.22*walkAmt);PU.WingR.rotation.z=f;PU.WingL.rotation.z=-f;
    PU.root.position.y=Math.abs(Math.sin(t*9))*.04*walkAmt;}
  // 가까운 전시물
  near=null;let best=3.1;
  spots().forEach(it=>{const d=Math.hypot(player.position.x-it.pos[0],player.position.z-it.pos[2]);if(d<Math.min(best,it.r||3.1)){best=d;near=it;}});
  if(near&&!open&&inside()){promptEl.style.display='flex';promptEl.innerHTML=`<span class="k">${coarse?'▶':'E'}</span>${near.name} <small>${near.emo}</small>`;}else promptEl.style.display='none';
  // 등불이 살짝 흔들림
  const fl=1.35+Math.sin(t*7.3)*.08+Math.sin(t*13.1)*.05;lanternLight.intensity=fl;lanternGlow.material.opacity=.75+Math.sin(t*9)*.08;
  // 향로·달·연기
  const inc=ITEMS.find(i=>i.id==='incense');if(inc.obj)inc.obj.rotation.y=t*.18;
  const jm=ITEMS.find(i=>i.id==='jeongeup');if(jm.moon){jm.moon.material.emissiveIntensity=.8+Math.sin(t*1.1)*.12;jm.halo.material.opacity=.45+Math.sin(t*1.1)*.1;jm.moon.position.y=jm.halo.position.y=2.25+Math.sin(t*.6)*.05;}
  SMOKE.forEach(s=>{s.userData.t=(s.userData.t+dt*.12)%1;const k=s.userData.t;s.position.set(Math.sin(k*9+s.id)*.12*k,1.06+1.55+k*2.2,Math.cos(k*7+s.id)*.1*k);s.scale.setScalar(.25+k*1.1);s.material.opacity=Math.sin(k*Math.PI)*.22;});
  const p=dustGeo.attributes.position.array;for(let i=0;i<DUST_N;i++){p[i*3+1]+=dt*.05;p[i*3]+=Math.sin(t*.3+i)*dt*.02;if(p[i*3+1]>5.8)p[i*3+1]=0;}dustGeo.attributes.position.needsUpdate=true;
  // 카메라(벽 밖으로 나가지 않게)
  const cx=player.position.x+Math.sin(yaw)*Math.cos(pitch)*dist,cz=player.position.z+Math.cos(yaw)*Math.cos(pitch)*dist,cy=1.35+Math.sin(pitch)*dist;
  const CB=bounds();
  if(open&&focusIt&&focusIt.focus){ // 해설을 보는 동안: 유물 쪽으로 천천히 다가가고 주변은 어둡게
    const fp=focusIt.focus;let dx=player.position.x-fp.x,dz=player.position.z-fp.z;const dl=Math.hypot(dx,dz)||1;dx/=dl;dz/=dl;
    const wide=innerWidth>700?.95:.6, back=focusIt.id==='end'?4.2:3.2;
    const cp=new THREE.Vector3(fp.x+dx*back,fp.y+.45,fp.z+dz*back);cp.x=Math.max(CB.xmin-.3,Math.min(CB.xmax+.3,cp.x));cp.z=Math.max(CB.zmin-.3,Math.min(CB.zmax+.3,cp.z));
    camera.position.lerp(cp,Math.min(1,dt*1.8));
    LT.lerp(new THREE.Vector3(fp.x+dz*wide,fp.y-.15,fp.z-dx*wide),Math.min(1,dt*2.4));
    hemi.intensity+=(.3-hemi.intensity)*Math.min(1,dt*2);
  } else {
    camera.position.lerp(new THREE.Vector3(Math.max(CB.xmin-.3,Math.min(CB.xmax+.3,cx)),Math.min(cy,5.2),Math.max(CB.zmin-.3,Math.min(CB.zmax+.3,cz))),Math.min(1,dt*(focusIt===null?8:3)));
    LT.lerp(new THREE.Vector3(player.position.x-Math.sin(yaw)*1.6,1.25,player.position.z-Math.cos(yaw)*1.6),Math.min(1,dt*10));
    hemi.intensity+=(1-hemi.intensity)*Math.min(1,dt*2);
  }
  C2.update(t,dt);
  camera.lookAt(LT);
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
addEventListener('resize',()=>{fitCamera();renderer.setSize(innerWidth,innerHeight);});
camera.position.set(0,3,13);
loop();
// 글꼴이 늦게 오면 글씨 판을 다시 그림
if(document.fonts)Promise.all([document.fonts.load('700 64px "Gowun Batang"'),document.fonts.load('400 64px "Gowun Batang"')]).then(()=>REDRAW.forEach(f=>f())).catch(()=>{});
</script>
</body>
